name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone output
        run: |
          cp -r .next/standalone/.next .next/standalone/package.json .next/standalone/node_modules .next/standalone/data .next/standalone/lib deploy/
          mkdir -p deploy/data

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: appuser
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: "node_modules/, .git/, .next/cache/"
          ARGS: "-rlgoDzvc -i --delete"

      - name: Restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: appuser
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            npm run db:migrate
            sudo systemctl restart nearmefc
