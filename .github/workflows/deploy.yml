name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Keep deployment gated on recovery prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in 212 213; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq .state)"
            if [ "$state" != "closed" ]; then
              echo "::error::Deployment requires issue #$issue to be closed (current state: $state)."
              exit 1
            fi
          done

      - name: Read supported Node.js version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Verify VPS Node.js before upload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: appuser
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            expected="v${{ steps.node-version.outputs.version }}"
            actual="$(/usr/bin/node --version)"
            if [ "$actual" != "$expected" ]; then
              echo "VPS Node.js mismatch: expected $expected, found $actual"
              exit 1
            fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone bundle
        run: |
          npm run standalone:prepare
          rm -rf deploy
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/lib/db
          cp .nvmrc deploy/.nvmrc
          cp -r lib/db/migrations deploy/lib/db/migrations
          cp lib/db/migrate.ts deploy/lib/db/migrate.ts
          cp -r ./scripts deploy/scripts

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: appuser
          SOURCE: "deploy/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: "data/*.sqlite, data/*.sqlite-shm, data/*.sqlite-wal"
          ARGS: "-rlgoDzvc -i"

      - name: Verify deployed Node.js and native SQLite before migration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: appuser
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            expected="v$(cat .nvmrc)"
            actual="$(/usr/bin/node --version)"
            if [ "$actual" != "$expected" ]; then
              echo "Deployed runtime mismatch: expected $expected, found $actual"
              exit 1
            fi
            /usr/bin/node -e 'const Database = require("better-sqlite3"); const db = new Database(":memory:"); db.prepare("SELECT 1").get(); db.close();'

      - name: Restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: appuser
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            set -a
            . /etc/nearmefc.env
            set +a
            /usr/bin/node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/db-migrate-prod.ts
            sudo systemctl restart nearmefc

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: appuser
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            HEALTHCHECK_URL="http://localhost:3000/api/health"
            for i in {1..30}; do
              if curl -fsS --max-time 5 "$HEALTHCHECK_URL" > /dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after 60s"
            sudo journalctl -u nearmefc -n 100 --no-pager
            exit 1
